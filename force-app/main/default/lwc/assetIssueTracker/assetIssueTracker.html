<template>
    <lightning-card title="Track Your Issue" icon-name="standard:search">
        <div class="slds-var-p-around_medium">
            <lightning-layout vertical-align="end" pull-to-boundary="small">
                <lightning-layout-item flexibility="grow" padding="horizontal-small">
                    <lightning-input type="text" label="Tracking ID" value={trackingId} onchange={handleInputChange}
                        placeholder="e.g. EAM-MOCK-a00..."></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="horizontal-small">
                    <lightning-button variant="brand" label="Check Status" onclick={checkStatus}></lightning-button>
                </lightning-layout-item>
            </lightning-layout>

            <template if:true={statusResult}>
                <div class="slds-var-m-top_large slds-box slds-theme_default slds-text-align_center">
                    <p class="slds-text-heading_medium">Current Status:</p>
                    <p class="slds-text-heading_large slds-text-color_success slds-var-m-top_small">
                        <b>{statusResult}</b></p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
