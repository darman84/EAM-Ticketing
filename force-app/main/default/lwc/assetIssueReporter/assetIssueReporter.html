<template>
    <div class="premium-container slds-is-relative">
        <div class="background-blob blob-1"></div>
        <div class="background-blob blob-2"></div>

        <div class="glass-card">
            <header class="card-header">
                <div class="header-icon-wrapper">
                    <lightning-icon icon-name="custom:custom85" size="medium" variant="inverse"></lightning-icon>
                </div>
                <div class="header-text">
                    <h1 class="title">Report Infrastructure Issue</h1>
                    <p class="subtitle">Quickly notify the city of pavement, signage, or utility concerns.</p>
                </div>
            </header>

            <div class="card-content premium-form">
                <template if:true={showForm}>
                    <div class="content-grid">
                        <!-- Left Column: Form Fields -->
                        <div class="form-column">
                            <h2 class="section-title">
                                <lightning-icon icon-name="utility:edit_form" size="x-small" class="section-icon slds-m-right_x-small"></lightning-icon>
                                Issue Details
                            </h2>
                            <div class="input-stack">
                                <lightning-combobox name="assetType" label="Asset Type" value={form.assetType}
                                    placeholder="Select Asset Type" options={assetTypeOptions} required
                                    onchange={onFieldChange}>
                                </lightning-combobox>

                                <lightning-combobox name="severity" label="Severity" value={form.severity}
                                    placeholder="Select Severity" options={severityOptions} required onchange={onFieldChange}>
                                </lightning-combobox>

                                <lightning-textarea name="description" label="Description" value={form.description} required
                                    onchange={onFieldChange} placeholder="Provide details about the issue...">
                                </lightning-textarea>
                            </div>

                            <hr class="divider"/>

                            <h2 class="section-title">
                                <lightning-icon icon-name="utility:user" size="x-small" class="section-icon slds-m-right_x-small"></lightning-icon>
                                Contact Info (Optional)
                            </h2>
                            <div class="input-stack">
                                <lightning-input type="email" name="submitterEmail" label="Email Address"
                                    value={form.submitterEmail} onchange={onFieldChange} placeholder="For status updates">
                                </lightning-input>

                                <lightning-input type="tel" name="submitterPhone" label="Phone Number"
                                    value={form.submitterPhone} onchange={onFieldChange} placeholder="(XXX) XXX-XXXX">
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Right Column: Location & Files -->
                        <div class="map-column">
                            <h2 class="section-title">
                                <lightning-icon icon-name="utility:location" size="x-small" class="section-icon slds-m-right_x-small"></lightning-icon>
                                Location Pinpoint
                            </h2>
                            
                            <div class="map-container-wrapper">
                                <div class="action-bar">
                                    <lightning-button icon-name="utility:checkin" label="My Location"
                                        onclick={getLocation} title="Use my current location"></lightning-button>
                                    <lightning-button icon-name="utility:target_mode" label="Set Pin"
                                        variant="neutral" onclick={setPinAtCenter} title="Set pin at map center"></lightning-button>
                                    
                                    <div class="action-icons">
                                        <lightning-button-icon icon-name="utility:add" variant="border-filled"
                                            onclick={zoomIn} alternative-text="Zoom in"></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:dash" variant="border-filled"
                                            onclick={zoomOut} alternative-text="Zoom out"></lightning-button-icon>
                                    </div>
                                    
                                    <div class="map-controls-spacer"></div>
                                    
                                    <lightning-button icon-name="utility:delete" label="Clear" variant="neutral"
                                        onclick={clearPin} title="Clear selected pin"></lightning-button>
                                </div>

                                <!-- Interactive Leaflet map container with crosshair overlay -->
                                <div class="map-inner">
                                    <div data-map lwc:dom="manual" class="leaflet-host"></div>
                                    <!-- Crosshair UI -->
                                    <div class="crosshair-circle"></div>
                                    <div class="crosshair-x"></div>
                                    <div class="crosshair-y"></div>
                                </div>
                            </div>
                            
                            <!-- Static Preview / Helper Message -->
                            <div class="location-preview slds-m-top_small">
                                <template if:false={mapMarkers.length}>
                                    <div class="glass-panel empty-state-message">
                                        <lightning-icon icon-name="utility:info_alt" size="x-small" class="opacity-50 slds-m-right_x-small"></lightning-icon>
                                        Select a location on the map to continue.
                                    </div>
                                </template>
                                <template if:true={mapMarkers.length}>
                                    <div class="glass-panel success-state-message">
                                        <lightning-icon icon-name="utility:success" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        Location successfully recorded.
                                    </div>
                                </template>
                            </div>

                            <div class="upload-section">
                                <div class="upload-header slds-m-bottom_small">
                                    <lightning-icon icon-name="utility:upload" size="small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="upload-title">Photo Evidence</span>
                                </div>
                                
                                <div class="upload-input-container">
                                    <lightning-input type="file" name="files" accept=".jpg,.jpeg,.png" multiple
                                        onchange={onFilesSelected} variant="label-hidden">
                                    </lightning-input>
                                </div>
                                <p class="upload-desc slds-m-top_x-small">Max 5 photos (.jpg, .png)</p>
                                
                                <template if:true={filePreviews.length}>
                                    <ul class="file-list">
                                        <template for:each={filePreviews} for:item="f">
                                            <li key={f.name} class="file-item">
                                                <lightning-icon icon-name="doctype:image" size="small"></lightning-icon>
                                                <div class="file-info">
                                                    <span class="file-name">{f.name}</span>
                                                    <span class="file-size">{f.sizeLabel}</span>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="submit-row">
                        <lightning-button variant="brand" label="Submit Infrastructure Issue" onclick={submitIssue}
                            disabled={submitting} class="submit-btn" icon-name="utility:send" icon-position="right"></lightning-button>
                    </div>
                </template>

                <template if:true={showUpload}>
                    <div class="success-view">
                        <div class="success-icon-wrapper">
                            <lightning-icon icon-name="utility:check" size="large" variant="inverse"></lightning-icon>
                        </div>
                        <h2 class="success-title">Issue Reported Successfully!</h2>
                        <p class="success-message">Thank you for helping keep the city functional. Your report has been dispatched to the appropriate department.</p>
                        <lightning-button variant="brand" label="Report Another Issue"
                            onclick={resetWizard} class="success-button" icon-name="utility:add"></lightning-button>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
